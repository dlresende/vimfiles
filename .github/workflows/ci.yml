name: CI

on:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install linter dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          pipx install vim-vint
          pipx inject vim-vint setuptools

      - name: Run lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        editor: [nvim, vim]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y neovim vim-nox universal-ctags xsel ruby shellcheck
          npm install -g yarn bash-language-server
          sudo gem install solargraph
          pipx install ruff
          pipx install vim-vint
          pipx inject vim-vint setuptools

      - name: Install gopls
        run: |
          go install golang.org/x/tools/gopls@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Install configuration and plugins
        run: |
          ln -snf "$GITHUB_WORKSPACE" "$HOME/.vim"
          make install

      - name: Run tests
        run: make test-${{ matrix.editor }}
